<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Book ISBN Scanner – Full API Response</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<style>
body{
  font-family: monospace;
  background:#111;
  color:#0f0;
  text-align:center;
}
#scanner{
  width:100%;
  max-width:420px;
  height:300px;
  margin:auto;
  border:2px solid #0f0;
}
#scanner video{
  width:100%;
  height:100%;
  object-fit:cover;
}
pre{
  text-align:left;
  max-width:95%;
  margin:20px auto;
  background:#000;
  padding:15px;
  overflow:auto;
  border:1px solid #0f0;
}
</style>
</head>

<body>

<h2>📚 ISBN Barcode Scanner (RAW RESPONSE)</h2>
<p>Scan book barcode → full API JSON dikhega</p>

<div id="scanner"></div>

<h3 id="isbn"></h3>

<pre id="output">Waiting for scan…</pre>

<script>
Quagga.init({
  inputStream:{
    type:"LiveStream",
    target:document.querySelector("#scanner"),
    constraints:{facingMode:"environment"}
  },
  locate:true,
  decoder:{readers:["ean_reader"]}
}, function(err){
  if(err){ alert(err); return; }
  Quagga.start();
});

Quagga.onDetected(function(data){
  let isbn = data.codeResult.code;
  if(isbn.length !== 13) return;

  Quagga.stop();
  document.getElementById("isbn").innerText = "ISBN: " + isbn;
  document.getElementById("output").innerText = "Fetching edition data…";

  // -------- EDITION DATA --------
  fetch("https://openlibrary.org/isbn/"+isbn+".json")
    .then(r=>r.json())
    .then(edition=>{
      let result = {
        ISBN: isbn,
        EDITION_RESPONSE: edition
      };

      // -------- WORK DATA (if exists) --------
      if(edition.works && edition.works.length > 0){
        let workKey = edition.works[0].key;

        fetch("https://openlibrary.org"+workKey+".json")
          .then(r=>r.json())
          .then(work=>{
            result.WORK_RESPONSE = work;
            document.getElementById("output").innerText =
              JSON.stringify(result, null, 2);
          })
          .catch(()=>{
            document.getElementById("output").innerText =
              JSON.stringify(result, null, 2);
          });

      } else {
        document.getElementById("output").innerText =
          JSON.stringify(result, null, 2);
      }
    })
    .catch(()=>{
      document.getElementById("output").innerText =
        "❌ No data found for this ISBN";
    });
});
</script>

</body>
</html>

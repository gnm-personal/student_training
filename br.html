<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ISBN Scanner – Single File Stable</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<style>
body{
  font-family: monospace;
  background:#111;
  color:#0f0;
  text-align:center;
  margin:0;
  padding:20px;
}
#scanner{
  position:relative;
  overflow:hidden;
  width:100%;
  max-width:420px;
  height:280px;
  margin:15px auto;
  border:2px solid #0f0;
}
#scanner video,
#scanner canvas{
  position:absolute;
  top:0; left:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
input,button{
  font-family:monospace;
  padding:8px;
  margin:5px;
}
#resolved{
  max-width:420px;
  margin:10px auto;
  padding:10px;
  background:#222;
  color:#fff;
  border:1px solid #0f0;
}
pre{
  max-width:95%;
  margin:10px auto;
  background:#000;
  padding:10px;
  overflow:auto;
  text-align:left;
}
</style>
</head>

<body>

<h3>📚 ISBN Scanner (Stable Single File)</h3>

<input id="isbnInput" placeholder="Enter ISBN-13 manually">
<button onclick="manualFetch()">Fetch</button>
<br>
<button onclick="startScanner()">📷 Start Scanner</button>

<div id="scanner"></div>

<div id="resolved">Waiting…</div>
<pre id="raw">RAW RESPONSE</pre>

<script>
let scanning=false;

function startScanner(){
  if(scanning) return;
  scanning=true;

  Quagga.init({
    inputStream:{
      type:"LiveStream",
      target:"#scanner",
      constraints:{facingMode:"environment"}
    },
    locate:true,
    decoder:{readers:["ean_reader"]}
  }, err=>{
    if(err){ alert(err); scanning=false; return; }
    Quagga.start();
  });

  Quagga.onDetected(d=>{
    if(!scanning) return;
    let isbn=d.codeResult.code;
    if(!/^\d{13}$/.test(isbn)) return;
    scanning=false;
    Quagga.stop();
    fetchISBN(isbn);
  });
}

function manualFetch(){
  let isbn=document.getElementById("isbnInput").value.trim();
  if(!/^\d{13}$/.test(isbn)){
    alert("Valid 13-digit ISBN only");
    return;
  }
  fetchISBN(isbn);
}

function fetchISBN(isbn){
  document.getElementById("resolved").innerText=
    "ISBN: "+isbn+"\nFetching…";

  let RAW={ISBN:isbn};

  fetch("https://openlibrary.org/isbn/"+isbn+".json")
    .then(r=>{if(!r.ok) throw 0; return r.json();})
    .then(edition=>{
      RAW.OPENLIBRARY=edition;
      return fetchGoogle(isbn,RAW);
    })
    .catch(()=>{
      return fetchGoogle(isbn,RAW);
    });
}

function fetchGoogle(isbn,RAW){
  fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:"+isbn)
    .then(r=>r.json())
    .then(g=>{
      RAW.GOOGLE=g;
      let info=g.items?.[0]?.volumeInfo||{};
      document.getElementById("resolved").innerText=
        "RESOLVED\n"+
        "Title: "+(info.title||"NA")+"\n"+
        "Author: "+(info.authors?.[0]||"NA")+"\n"+
        "Publisher: "+(info.publisher||"NA")+"\n"+
        "Year: "+(info.publishedDate||"NA");
      document.getElementById("raw").innerText=
        JSON.stringify(RAW,null,2);
    })
    .catch(()=>{
      document.getElementById("resolved").innerText="❌ No data found";
    });
}
</script>

</body>
</html>

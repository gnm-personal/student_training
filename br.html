<!DOCTYPE html>
<html>
<head>
  <title>Barcode Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
</head>
<body>

<h2>Scan Barcode</h2>
<div id="scanner" style="width:400px; height:300px;"></div>
<p><b>Barcode:</b> <span id="result"></span></p>

<script>
Quagga.init({
  inputStream: {
    name: "Live",
    type: "LiveStream",
    target: document.querySelector('#scanner')
  },
  decoder: {
    readers: [
      "ean_reader",
      "ean_8_reader",
      "upc_reader",
      "code_128_reader"
    ]
  }
}, function(err) {
  if (err) {
    console.log(err);
    return;
  }
  Quagga.start();
});

Quagga.onDetected(function(data) {
  document.getElementById("result").innerText =
    data.codeResult.code;
});
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Book ISBN Scanner – Raw Preserved</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<style>
body{
  font-family: monospace;
  background:#111;
  color:#0f0;
  text-align:center;
}
#scanner{
  width:100%;
  max-width:420px;
  height:300px;
  margin:auto;
  border:2px solid #0f0;
}
#scanner video{
  width:100%;
  height:100%;
  object-fit:cover;
}
pre{
  max-width:95%;
  margin:15px auto;
  background:#000;
  padding:15px;
  overflow:auto;
  text-align:left;
}
#resolved{
  max-width:420px;
  margin:15px auto;
  background:#222;
  padding:15px;
  color:#fff;
  border:1px solid #0f0;
}
</style>
</head>

<body>

<h2>📚 ISBN Scanner (RAW RESPONSE PRESERVED)</h2>

<div id="scanner"></div>

<div id="resolved">Waiting for scan…</div>

<pre id="raw">RAW API RESPONSE WILL APPEAR HERE</pre>

<script>
Quagga.init({
  inputStream:{
    type:"LiveStream",
    target:document.querySelector("#scanner"),
    constraints:{facingMode:"environment"}
  },
  locate:true,
  decoder:{readers:["ean_reader"]}
}, function(err){
  if(err){ alert(err); return; }
  Quagga.start();
});

Quagga.onDetected(function(data){
  let isbn = data.codeResult.code;
  if(isbn.length !== 13) return;

  Quagga.stop();

  let RAW = { ISBN: isbn };

  document.getElementById("resolved").innerText =
    "ISBN detected: " + isbn + "\nFetching data…";

  // -------- EDITION --------
  fetch("https://openlibrary.org/isbn/"+isbn+".json")
    .then(r=>r.json())
    .then(edition=>{
      RAW.EDITION = edition;

      let workKey = edition.works?.[0]?.key;
      if(!workKey){
        finish(RAW, null, null);
        return;
      }

      // -------- WORK --------
      fetch("https://openlibrary.org"+workKey+".json")
        .then(r=>r.json())
        .then(work=>{
          RAW.WORK = work;

          let authorKey = work.authors?.[0]?.author?.key;
          if(!authorKey){
            finish(RAW, work, null);
            return;
          }

          // -------- AUTHOR --------
          fetch("https://openlibrary.org"+authorKey+".json")
            .then(r=>r.json())
            .then(author=>{
              RAW.AUTHOR = author;
              finish(RAW, work, author);
            })
            .catch(()=>finish(RAW, work, null));
        })
        .catch(()=>finish(RAW, null, null));
    })
    .catch(()=>{
      document.getElementById("resolved").innerText =
        "❌ No data found for this ISBN";
    });
});

function finish(RAW, work, author){
  // -------- RESOLVED (SEPARATE, NON-DESTRUCTIVE) --------
  let resolved = {
    title: work?.title || RAW.EDITION?.title || "NA",
    author_name: author?.name || "NA"
  };

  document.getElementById("resolved").innerText =
    "RESOLVED VIEW\n" +
    "Title: " + resolved.title + "\n" +
    "Author: " + resolved.author_name;

  // -------- RAW JSON UNCHANGED --------
  document.getElementById("raw").innerText =
    JSON.stringify(RAW, null, 2);
}
</script>

</body>
</html>

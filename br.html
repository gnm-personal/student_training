<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ISBN Scanner – Clean No Quota</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<style>
body{
  font-family: monospace;
  background:#111;
  color:#0f0;
  text-align:center;
  padding:20px;
  margin:0;
}
#scanner{
  position:relative;
  overflow:hidden;
  width:100%;
  max-width:420px;
  height:280px;
  margin:15px auto;
  border:2px solid #0f0;
}
#scanner video,
#scanner canvas{
  position:absolute;
  top:0; left:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
input,button{
  font-family:monospace;
  padding:8px;
  margin:5px;
}
#resolved{
  max-width:420px;
  margin:10px auto;
  padding:10px;
  background:#222;
  color:#fff;
  border:1px solid #0f0;
  white-space:pre-line;
}
pre{
  max-width:95%;
  margin:10px auto;
  background:#000;
  padding:10px;
  overflow:auto;
  text-align:left;
}
</style>
</head>

<body>

<h3>📚 ISBN Scanner (No Quota Version)</h3>

<input id="isbnInput" placeholder="Enter ISBN-13 manually">
<button onclick="manualFetch()">Fetch</button>
<br>
<button onclick="startScanner()">📷 Start Scanner</button>

<div id="scanner"></div>

<div id="resolved">Waiting…</div>
<pre id="raw">RAW RESPONSE</pre>

<script>
let scanning=false;

function startScanner(){
  if(scanning) return;
  scanning=true;

  Quagga.init({
    inputStream:{
      type:"LiveStream",
      target:"#scanner",
      constraints:{facingMode:"environment"}
    },
    locate:true,
    decoder:{readers:["ean_reader"]}
  }, err=>{
    if(err){ alert(err); scanning=false; return; }
    Quagga.start();
  });

  Quagga.onDetected(d=>{
    if(!scanning) return;
    let isbn=d.codeResult.code;
    if(!/^\d{13}$/.test(isbn)) return;
    scanning=false;
    Quagga.stop();
    fetchISBN(isbn);
  });
}

function manualFetch(){
  let isbn=document.getElementById("isbnInput").value.trim();
  if(!/^\d{13}$/.test(isbn)){
    alert("Enter valid 13-digit ISBN");
    return;
  }
  fetchISBN(isbn);
}

function fetchISBN(isbn){
  document.getElementById("resolved").innerText=
    "ISBN: "+isbn+"\nFetching from OpenLibrary…";

  let RAW={ISBN:isbn};

  fetch("https://openlibrary.org/isbn/"+isbn+".json")
    .then(r=>{
      if(!r.ok) throw 0;
      return r.json();
    })
    .then(edition=>{
      RAW.EDITION=edition;

      let title=edition.title||"NA";
      let year=edition.publish_date||"NA";
      let publisher=edition.publishers?.[0]||"NA";

      document.getElementById("resolved").innerText=
        "RESOLVED\n"+
        "Title: "+title+"\n"+
        "Publisher: "+publisher+"\n"+
        "Year: "+year+"\n"+
        "(Author data not always available)";

      document.getElementById("raw").innerText=
        JSON.stringify(RAW,null,2);
    })
    .catch(()=>{
      document.getElementById("resolved").innerText=
        "❌ ISBN not found in OpenLibrary\n"+
        "This is common for many Indian books.";
      document.getElementById("raw").innerText=
        JSON.stringify(RAW,null,2);
    });
}
</script>

</body>
</html>

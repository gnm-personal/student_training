<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ISBN Scanner + Manual Fetch</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<style>
body{
  font-family: monospace;
  background:#111;
  color:#0f0;
  text-align:center;
}
#scanner{
  width:100%;
  max-width:420px;
  height:300px;
  margin:auto;
  border:2px solid #0f0;
  display:none;
}
input,button{
  padding:8px;
  font-family:monospace;
  margin:5px;
}
pre{
  max-width:95%;
  margin:15px auto;
  background:#000;
  padding:15px;
  overflow:auto;
  text-align:left;
}
#resolved{
  max-width:420px;
  margin:15px auto;
  background:#222;
  padding:15px;
  color:#fff;
  border:1px solid #0f0;
}
</style>
</head>

<body>

<h2>📚 ISBN Scanner + Manual Input</h2>

<input id="isbnInput" placeholder="Enter ISBN-13 manually">
<button onclick="manualFetch()">Fetch</button>

<br><br>
<button onclick="startScanner()">📷 Start Scanner</button>

<div id="scanner"></div>

<div id="resolved">Waiting…</div>
<pre id="raw">RAW API RESPONSE</pre>

<script>
let scanning = false;

function startScanner(){
  document.getElementById("scanner").style.display="block";
  scanning = true;

  Quagga.init({
    inputStream:{
      type:"LiveStream",
      target:document.querySelector("#scanner"),
      constraints:{facingMode:"environment"}
    },
    locate:true,
    decoder:{readers:["ean_reader"]}
  }, err=>{
    if(err){ alert(err); return; }
    Quagga.start();
  });

  Quagga.onDetected(data=>{
    if(!scanning) return;

    let isbn = data.codeResult.code;
    if(!/^\d{13}$/.test(isbn)) return;

    scanning = false;
    Quagga.stop();
    fetchISBN(isbn);
  });
}

function manualFetch(){
  let isbn = document.getElementById("isbnInput").value.trim();
  if(!/^\d{13}$/.test(isbn)){
    alert("Enter valid 13-digit ISBN");
    return;
  }
  fetchISBN(isbn);
}

function fetchISBN(isbn){
  document.getElementById("resolved").innerText =
    "ISBN: "+isbn+"\nFetching data…";

  let RAW = { ISBN:isbn };

  fetch("https://openlibrary.org/isbn/"+isbn+".json")
    .then(r=>r.json())
    .then(edition=>{
      RAW.EDITION = edition;

      let workKey = edition.works?.[0]?.key;
      if(!workKey) return finish(RAW,null,null);

      return fetch("https://openlibrary.org"+workKey+".json")
        .then(r=>r.json())
        .then(work=>{
          RAW.WORK = work;

          let authorKey = work.authors?.[0]?.author?.key;
          if(!authorKey) return finish(RAW,work,null);

          return fetch("https://openlibrary.org"+authorKey+".json")
            .then(r=>r.json())
            .then(author=>{
              RAW.AUTHOR = author;
              finish(RAW,work,author);
            });
        });
    })
    .catch(()=>{
      document.getElementById("resolved").innerText =
        "❌ No data found for this ISBN";
    });
}

function finish(RAW,work,author){
  document.getElementById("resolved").innerText =
    "RESOLVED\n"+
    "Title: "+(work?.title || RAW.EDITION?.title || "NA")+"\n"+
    "Author: "+(author?.name || "NA");

  document.getElementById("raw").innerText =
    JSON.stringify(RAW,null,2);
}
</script>

</body>
</html>

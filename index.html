<html>
  <head>
    <title>Library Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="height=device-height,initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-init.js" defer></script>
    <script src="js/users.js" defer></script>
  </head>
  <body class="signInPage" >
    <div class="form">
      <form id="userform">
        <h1>
          Registration Form
        </h1>
        <input id="name" type="text" placeholder="Enter your name here" required>
        <input id="email" type="email" placeholder="Enter your email here" required>
        <input id="password" type="password" placeholder="Enter your password here" required>
        <button type="submit" >Click to Register</button>
      </form>
    </div>
  </body>
</html>
